[project]
name = "terminal-ielts"
version = "0.1.0"
description = "A source-backed Textual terminal app for IELTS reading practice"
readme = "README.md"
authors = [
    { name = "devsuperjin", email = "yaojin101@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "textual>=8.2.8",
]

[project.scripts]
terminal-ielts = "terminal_ielts:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
